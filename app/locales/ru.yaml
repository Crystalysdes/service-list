g:
  open_deal: "📂 Сделка #{n}"
  home: "🛡 <b>Auto-garant</b> — сделка через гаранта\n\n💰 Покупатель платит боту, деньги <b>замораживаются</b>: продавец получит их только после подтверждения покупателя.\n⚖️ Если стороны не договорились — спор решает модератор.\n💸 Комиссия гаранта — {fee}%, кто её платит, выбираете вы.\n💵 Оплата в USDT в сети BNB Smart Chain (BEP20), выплаты — на ваш кошелёк."
  home_off: "⏸ Сейчас новые сделки не принимаются — скоро включим. Открытые сделки продолжаются как обычно."
  how: "📖 <b>Как работает Auto-garant</b>\n\n1️⃣ Одна сторона создаёт сделку: что продаётся, условия, сумма, срок — и отправляет второй ссылку-приглашение.\n2️⃣ Вторая сторона видит условия и репутацию создателя и принимает их.\n3️⃣ Покупатель переводит USDT (BEP20) на адрес из бота — деньги замораживаются у гаранта.\n4️⃣ Продавец выполняет условия и нажимает «📦 Передал».\n5️⃣ Покупатель проверяет и нажимает «✅ Отпустить деньги» — продавец сразу получает оплату на свой адрес USDT (BEP20).\n\n⏱ Если покупатель молчит {release_hours} ч после «Передал», деньги уходят продавцу автоматически. Если продавец не успел к сроку, через {grace_hours} ч открывается спор.\n⚖️ Спор решает модератор: отдать продавцу, вернуть покупателю или разделить.\n🤝 Оплаченную сделку можно отменить только по согласию обеих сторон.\n💸 Комиссия {fee}% после оплаты не возвращается ни при каком исходе. Комиссии сети и платёжного шлюза вычитаются из каждой выплаты — получатель видит их.\n\n🔒 Бот всегда показывает Telegram ID сторон, а деньги принимает только по своей кнопке «Оплатить». Не платите по ссылкам из переписки."
