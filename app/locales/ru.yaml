  rules: "📌 <b>Правила</b>\n• Деньги покупателя хранятся у гаранта, пока он не подтвердит получение.\n• Если покупатель молчит {release_hours} ч после «Передал», деньги уходят продавцу.\n• Не успел продавец к сроку — через {grace_hours} ч открывается спор.\n• Спор решает модератор; отменить оплаченную сделку можно только по согласию обеих сторон.\n• После оплаты комиссия {fee} не возвращается ни при каком исходе.\n• Комиссии сети и платёжного шлюза вычитаются из каждой выплаты."
