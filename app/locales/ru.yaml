  how: "📖 <b>Как работает Auto-garant</b>\n\n1️⃣ Одна сторона создаёт сделку: что продаётся, условия, сумма, срок — и отправляет второй ссылку-приглашение.\n2️⃣ Вторая сторона видит условия и репутацию создателя и принимает их.\n3️⃣ Покупатель платит счёт в @CryptoBot — деньги замораживаются у гаранта.\n4️⃣ Продавец выполняет условия и нажимает «📦 Передал».\n5️⃣ Покупатель проверяет и нажимает «✅ Отпустить деньги» — продавец сразу получает оплату в @CryptoBot.\n\n⏱ Если покупатель молчит {release_hours} ч после «Передал», деньги уходят продавцу автоматически. Если продавец не успел к сроку, через {grace_hours} ч открывается спор.\n⚖️ Спор решает модератор: отдать продавцу, вернуть покупателю или разделить.\n🤝 Оплаченную сделку можно отменить только по согласию обеих сторон.\n💸 Комиссия {fee}% после оплаты не возвращается ни при каком исходе.\n\n🔒 Бот всегда показывает Telegram ID сторон, а деньги принимает только по своей кнопке «Оплатить». Не платите по ссылкам из переписки."
