help:
  text: "<b>Как это работает</b>\n\n➕ <b>Add service</b> — опишите сервис и пришлите ссылку. После проверки модератором бот пришлёт счёт, после оплаты сервис появится в нужной ветке канала.\n\n🗂 <b>My services</b> — ваши сервисы: топ-1/2/3, премиум-эмодзи перед названием, название из анимированных эмодзи, продление и статистика.\n\n⚠️ <b>Report service</b> — пожаловаться на сервис (нужны скриншоты и подробное описание).\n\n🚫 <b>Scam list</b> — сервисы, признанные мошенническими."
