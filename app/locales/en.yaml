g:
  open_deal: "📂 Deal #{n}"
  home: "🛡 <b>Auto-garant</b> — a deal through the garant\n\n💰 The buyer pays the bot and the money is <b>held</b>: the seller gets it only after the buyer confirms.\n⚖️ If the sides cannot agree, a moderator decides.\n💸 The garant's fee is {fee}%, you choose who pays it.\n💵 Payment in USDT on BNB Smart Chain (BEP20); payouts go to your wallet."
  home_off: "⏸ New deals are not taken right now — coming soon. Open deals go on as usual."
  how: "📖 <b>How Auto-garant works</b>\n\n1️⃣ One side creates a deal: what is sold, the terms, the amount, the deadline — and sends the other an invitation link.\n2️⃣ The other side sees the terms and the creator's record and accepts them.\n3️⃣ The buyer sends USDT (BEP20) to the address the bot gives — the money is held by the garant.\n4️⃣ The seller delivers and taps «📦 Delivered».\n5️⃣ The buyer checks and taps «✅ Release the money» — the seller is paid to their USDT (BEP20) address at once.\n\n⏱ If the buyer stays silent for {release_hours} h after «Delivered», the money goes to the seller automatically. If the seller misses the deadline, a dispute opens after {grace_hours} h.\n⚖️ A moderator decides disputes: to the seller, back to the buyer, or split.\n🤝 A paid deal can be cancelled only if both sides agree.\n💸 Once paid, the {fee}% fee is not returned in any outcome. The network and payment gateway fees come out of every payout — the recipient sees them.\n\n🔒 The bot always shows the sides' Telegram IDs and takes money only through its own «Pay» button. Never pay by links from a chat."
  share_text: "A deal through Auto-garant: {title}"
  rules: "📌 <b>Rules</b>\n• The buyer's money is held by the garant until the buyer confirms.\n• If the buyer stays silent for {release_hours} h after «Delivered», the money goes to the seller.\n• If the seller misses the deadline, a dispute opens after {grace_hours} h.\n• A moderator decides disputes; a paid deal is cancelled only if both sides agree.\n• Once paid, the fee of {fee} is not returned in any outcome.\n• The network and payment gateway fees come out of every payout."
  role:
    buyer: "Buyer"
    seller: "Seller"
  to:
    seller: "to the seller"
    buyer: "to the buyer"
    extra: "refund of an extra payment"
  payer:
