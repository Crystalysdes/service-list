services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: servicelist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servicelist}
      POSTGRES_DB: servicelist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicelist -d servicelist"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://servicelist:${POSTGRES_PASSWORD:-servicelist}@db:5432/servicelist
      DATA_DIR: /data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - botdata:/data

volumes:
  pgdata:
  botdata:
