x-logging: &logging  # container logs are rotated, never fill the disk
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: servicelist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servicelist}
      POSTGRES_DB: servicelist
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicelist -d servicelist"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    restart: unless-stopped
    stop_grace_period: 60s  # a garant transfer on its way gets its answer before the bot stops
    logging: *logging
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://servicelist:${POSTGRES_PASSWORD:-servicelist}@db:5432/servicelist
      DATA_DIR: /data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - botdata:/data

volumes:
  pgdata:
  botdata:
