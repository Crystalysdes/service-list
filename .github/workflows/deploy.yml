# Tests on every push; when they pass, the server is updated over SSH.
# Deploy needs the repository secrets printed by deploy/bootstrap.sh on the server:
#   DEPLOY_HOST, DEPLOY_KNOWN_HOSTS, DEPLOY_SSH_KEY (+ DEPLOY_PORT when SSH is not on port 22)
# The key is restricted on the server: it can only run "deploy <commit sha>" of this branch.
name: test-and-deploy

on:
  push:
    branches: ["claude/amazing-pasteur-j0islp"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: servicelist
          POSTGRES_PASSWORD: servicelist
          POSTGRES_DB: servicelist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U servicelist -d servicelist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://servicelist:servicelist@localhost:5432/servicelist_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          # glowing names are drawn with DejaVu (usually there already; the index may be stale otherwise)
          dpkg -s fonts-dejavu-core >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          }
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Tests
        run: pytest -q

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/claude/amazing-pasteur-j0islp'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Deploy to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Deploy secrets are not set yet (DEPLOY_HOST, DEPLOY_KNOWN_HOSTS, DEPLOY_SSH_KEY) - skipping deploy."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT:-22}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            "root@$DEPLOY_HOST" "deploy $GITHUB_SHA"
